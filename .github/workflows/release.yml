name: Release

# Push a version tag to cut a release with downloadable extension binaries:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The binaries are built by DuckDB's official distribution pipeline, which runs
# the Linux builds inside a manylinux container (ancient glibc) and links libpq
# statically from vcpkg. That makes the binaries portable across distros — a
# binary built on the GitHub runner's modern glibc would otherwise fail to load
# on older systems with "GLIBC_2.xx not found". The publish job then attaches
# them to the GitHub Release for the tag.
# A tag push cuts a real GitHub Release. A manual run (Actions → Release → Run
# workflow) just builds the portable binaries and leaves them as downloadable
# run artifacts — handy for grabbing a one-off build without tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build portable, correctly-versioned binaries. Same pipeline (and same args)
  # as MainDistributionPipeline.yml — keep duckdb_version in sync with the
  # pinned `duckdb` submodule.
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5-variegata
      extension_name: hyphasync
      # Windows is unsupported (Unix-pipe COPY path); WASM has no libpq/sockets.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw
      reduced_ci_mode: disabled

  # Only tag pushes attach to a Release. On a manual run the build artifacts are
  # downloadable from the run page, so there's nothing to publish.
  publish:
    name: Attach binaries to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Pulls every artifact produced by the build job into artifacts/<name>/...
      # Artifact names look like: hyphasync-v1.5.2-extension-linux_amd64
      - name: Download built extensions
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage platform-named binaries
        run: |
          mkdir -p dist
          for art in artifacts/*/; do
            name=$(basename "$art")
            # Keep only the per-arch extension artifacts.
            case "$name" in
              *-extension-*) arch="${name##*-extension-}" ;;
              *) continue ;;
            esac
            file=$(find "$art" -name 'hyphasync.duckdb_extension' | head -n1)
            if [ -n "$file" ]; then
              cp "$file" "dist/hyphasync-${arch}.duckdb_extension"
              echo "staged dist/hyphasync-${arch}.duckdb_extension"
            fi
          done
          ls -l dist

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.duckdb_extension
          generate_release_notes: true
          fail_on_unmatched_files: true
