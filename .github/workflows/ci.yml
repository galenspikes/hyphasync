name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hypha
          POSTGRES_PASSWORD: hypha
          POSTGRES_DB: hypha_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install libpq and Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y libpq-dev postgresql-client

      - name: Set up build environment
        run: |
          MULTI=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || echo "x86_64-linux-gnu")
          echo "CMAKE_PREFIX_PATH=/usr" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/${MULTI}/pkgconfig" >> $GITHUB_ENV

      - name: Build
        run: CC=gcc CXX=g++ make release

      - name: Format check
        run: make format-check

      - name: SQL tests
        run: CC=gcc CXX=g++ make test

      - name: Performance benchmark
        run: BINARY=./build/release/duckdb ./scripts/benchmark-fingerprint.sh 60
        continue-on-error: true

      - name: Integration tests
        run: ./test/integration/run.sh --no-build
